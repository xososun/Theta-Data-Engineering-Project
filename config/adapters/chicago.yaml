# adapters/chicago.yaml
#
# Source adapter for the City of Chicago "Traffic Crashes - Crashes" dataset.

source_id: chicago_us
provider: City of Chicago Data Portal (Socrata)
dataset_url: https://data.cityofchicago.org/Transportation/Traffic-Crashes-Crashes/85ca-t3if
api_endpoint: https://data.cityofchicago.org/resource/85ca-t3if.json
format: csv
license: Public domain / open data (Chicago Data Portal terms)
city: Chicago
country: US
source_local_timezone: America/Chicago

date_format: "mixed"

bounding_box:
  latitude: [41.60, 42.05]
  longitude: [-87.95, -87.50]

field_mapping:
  source_id:
    literal: chicago_us
  source_local_timezone:
    literal: America/Chicago
  crash_id:
    derive_fn: chicago_crash_id
  source_record_id:
    from: CRASH_RECORD_ID
  crash_timestamp_utc:
    from: CRASH_DATE
  police_notified_timestamp_utc:
    from: DATE_POLICE_NOTIFIED
  city:
    literal: Chicago
  country:
    literal: US
  latitude:
    from: LATITUDE
  longitude:
    from: LONGITUDE
  has_valid_coordinates:
    derive_fn: chicago_has_valid_coordinates
  severity:
    from: MOST_SEVERE_INJURY
    map:
      "FATAL": fatal
      "INCAPACITATING INJURY": serious
      "NONINCAPACITATING INJURY": minor
      "REPORTED, NOT EVIDENT": minor
      "NO INDICATION OF INJURY": none
      null: unknown
    default: unknown
  source_severity_raw:
    from: MOST_SEVERE_INJURY
  num_injured_total:
    from: INJURIES_TOTAL
  num_killed:
    from: INJURIES_FATAL
  num_vehicles_involved:
    from: NUM_UNITS
  crash_type:
    from: FIRST_CRASH_TYPE
  primary_cause:
    from: PRIM_CONTRIBUTORY_CAUSE
  weather_condition:
    from: WEATHER_CONDITION
  lighting_condition:
    from: LIGHTING_CONDITION
  posted_speed_limit_mph:
    from: POSTED_SPEED_LIMIT
  hit_and_run:
    from: HIT_AND_RUN_I
    map:
      "Y": true
      null: false
    default: false

unmapped_columns_kept_in_staging:
  - CRASH_DATE_EST_I
  - TRAFFIC_CONTROL_DEVICE
  - DEVICE_CONDITION
  - TRAFFICWAY_TYPE
  - LANE_CNT
  - ALIGNMENT
  - ROADWAY_SURFACE_COND
  - ROAD_DEFECT
  - REPORT_TYPE
  - CRASH_TYPE
  - INTERSECTION_RELATED_I
  - NOT_RIGHT_OF_WAY_I
  - DAMAGE
  - SEC_CONTRIBUTORY_CAUSE
  - STREET_NO
  - STREET_DIRECTION
  - STREET_NAME
  - BEAT_OF_OCCURRENCE
  - PHOTOS_TAKEN_I
  - STATEMENTS_TAKEN_I
  - DOORING_I
  - WORK_ZONE_I
  - WORK_ZONE_TYPE
  - WORKERS_PRESENT_I
  - CRASH_MONTH
  - INJURIES_INCAPACITATING
  - INJURIES_NON_INCAPACITATING
  - INJURIES_REPORTED_NOT_EVIDENT
  - INJURIES_NO_INDICATION
  - INJURIES_UNKNOWN
  - CRASH_HOUR
  - CRASH_DAY_OF_WEEK
  - IDOT_CONTROL_NO
  - LOCATION

known_issues:
  - "1 row has police_notified_timestamp_utc earlier than crash_timestamp_utc."
  - "74 rows have LATITUDE=0 AND LONGITUDE=0 (sentinel)."
  - "5 rows missing BEAT_OF_OCCURRENCE."
  - "22 of 25 police districts have crashes before the citywide rollout date."
  - "POSTED_SPEED_LIMIT range 0-60, some implausible."