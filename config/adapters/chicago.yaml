# adapters/chicago.yaml
#
# Source adapter for the City of Chicago "Traffic Crashes - Crashes" dataset.
# This is the pattern every future city adapter follows: adding NYC or the
# UK means writing a new file like this one, not touching shared code.
#
# Values below (date parsing, bounding box, mappings) are set from
# profiling the real full export (Traffic_Crashes_-_Crashes_20260923.csv,
# 1,096,581 rows), not from the small samples used earlier.

source_id: chicago_us
provider: City of Chicago Data Portal (Socrata)
dataset_url: https://data.cityofchicago.org/Transportation/Traffic-Crashes-Crashes/85ca-t3if
format: csv          # bulk export; API retrieval (JSON) is the programmatic-source stretch goal
license: Public domain / open data (Chicago Data Portal terms)
city: Chicago
country: US
source_local_timezone: America/Chicago

# CRASH_DATE / DATE_POLICE_NOTIFIED are uniform "MM/DD/YYYY hh:mm:ss AM/PM"
# at full scale (confirmed: 1,096,581 / 1,096,581 rows). The mixed-format
# behavior seen in the small sample CSV did not reproduce in the real
# export, so a single strptime format is sufficient here — kept as
# format="mixed" anyway for defense-in-depth against a future export
# quirk, at negligible cost.
date_format: "mixed"

bounding_box:
  latitude: [41.60, 42.05]
  longitude: [-87.95, -87.50]

field_mapping:
  crash_id:
    derive: "'chicago_us:' + CRASH_RECORD_ID"
  source_record_id:
    from: CRASH_RECORD_ID
  crash_timestamp_utc:
    from: CRASH_DATE
    parse: date_format
    convert_timezone: source_local_timezone
  police_notified_timestamp_utc:
    from: DATE_POLICE_NOTIFIED
    parse: date_format
    convert_timezone: source_local_timezone
  city:
    literal: Chicago
  country:
    literal: US
  latitude:
    from: LATITUDE
    reject_sentinel_zero_pair_with: LONGITUDE
  longitude:
    from: LONGITUDE
    reject_sentinel_zero_pair_with: LATITUDE
  has_valid_coordinates:
    derive: >
      LATITUDE is not null and LONGITUDE is not null
      and not (LATITUDE == 0 and LONGITUDE == 0)
      and LATITUDE between bounding_box.latitude
      and LONGITUDE between bounding_box.longitude
  severity:
    from: MOST_SEVERE_INJURY
    map:
      "FATAL": fatal
      "INCAPACITATING INJURY": serious
      "NONINCAPACITATING INJURY": minor
      "REPORTED, NOT EVIDENT": minor
      "NO INDICATION OF INJURY": none
      null: unknown          # 2,370 / 1,096,581 rows at full scale
    default: unknown
  source_severity_raw:
    from: MOST_SEVERE_INJURY
  num_injured_total:
    from: INJURIES_TOTAL
  num_killed:
    from: INJURIES_FATAL
  num_vehicles_involved:
    from: NUM_UNITS
  crash_type:
    from: FIRST_CRASH_TYPE
  primary_cause:
    from: PRIM_CONTRIBUTORY_CAUSE
  weather_condition:
    from: WEATHER_CONDITION
  lighting_condition:
    from: LIGHTING_CONDITION
  posted_speed_limit_mph:
    from: POSTED_SPEED_LIMIT
  hit_and_run:
    from: HIT_AND_RUN_I
    map:
      "Y": true
      null: false             # Chicago only ever records the positive case
    default: false

# Columns present in the source but not mapped to canonical fields.
# Kept in the Chicago-specific staging table for lineage and in case a
# later analysis needs them; never promoted to the cross-city curated
# table without an explicit schema change.
unmapped_columns_kept_in_staging:
  - CRASH_DATE_EST_I
  - TRAFFIC_CONTROL_DEVICE
  - DEVICE_CONDITION
  - TRAFFICWAY_TYPE
  - LANE_CNT
  - ALIGNMENT
  - ROADWAY_SURFACE_COND
  - ROAD_DEFECT
  - REPORT_TYPE
  - CRASH_TYPE            # note: source's own CRASH_TYPE is a 2-value
                           # injury/no-injury flag, distinct from our
                           # canonical `crash_type`, which is sourced
                           # from FIRST_CRASH_TYPE instead. Do not confuse.
  - INTERSECTION_RELATED_I
  - NOT_RIGHT_OF_WAY_I    # >=95% null at full scale
  - DAMAGE
  - SEC_CONTRIBUTORY_CAUSE
  - STREET_NO
  - STREET_DIRECTION
  - STREET_NAME
  - BEAT_OF_OCCURRENCE    # used only to derive district for profiling/QA
  - PHOTOS_TAKEN_I        # >=95% null
  - STATEMENTS_TAKEN_I    # >=95% null
  - DOORING_I             # >=95% null
  - WORK_ZONE_I           # >=95% null
  - WORK_ZONE_TYPE        # >=95% null
  - WORKERS_PRESENT_I     # >=95% null
  - CRASH_MONTH
  - INJURIES_INCAPACITATING
  - INJURIES_NON_INCAPACITATING
  - INJURIES_REPORTED_NOT_EVIDENT
  - INJURIES_NO_INDICATION
  - INJURIES_UNKNOWN
  - CRASH_HOUR
  - CRASH_DAY_OF_WEEK
  - IDOT_CONTROL_NO
  - LOCATION               # redundant WKT point; LATITUDE/LONGITUDE used instead

# Known source-specific data-quality notes carried over from full-scale
# profiling, for the validation layer and the report:
known_issues:
  - "1 row (of 1,096,581) has police_notified_timestamp_utc earlier than
     crash_timestamp_utc by ~4,077 days. Quarantine, do not silently
     correct or drop."
  - "74 rows have LATITUDE=0 AND LONGITUDE=0 (sentinel bad-geocode value).
     Treated as missing coordinates, not (0,0) in the Gulf of Guinea."
  - "5 rows missing BEAT_OF_OCCURRENCE; harmless for canonical fields
     since it's not mapped, but breaks any district-level QA logic if not
     dropped/handled first."
  - "22 of 25 police districts have crash records before the citywide
     rollout date documented by the city (2017-09-01), with the earliest
     district starting 2013-03-03. Recommend windowing trend analysis
     from 2018-01-01 onward for citywide comparability; treat 2013-2017
     as partial-coverage ramp-up, not a data error."
  - "POSTED_SPEED_LIMIT full-scale range is 0-60, including some
     implausible low values. Flagged, not rejected, by the canonical
     schema's flag_if_outside rule."
