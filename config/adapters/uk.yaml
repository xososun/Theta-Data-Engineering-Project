# adapters/uk.yaml
#
# Source adapter for the UK Department for Transport STATS19 road safety
# collision data. Scoped to the last 5 published years (2021-2025) per
# the documented decision to avoid pre-2015-era schema drift in the full
# 1979-present archive (see docs/project_proposal.md, section 4).
#
# Values below are from profiling the actual 5-year file
# (dft-road-casualty-statistics-collision-last-5-years.csv,
# 513,801 rows, 44 columns), not the earlier single-year sample.

source_id: uk_stats19
provider: UK Department for Transport (data.gov.uk)
dataset_url: https://www.data.gov.uk/dataset/road-accidents-safety-data
format: csv               # one file per year published by DfT, concatenated for this 5-year window
license: Open Government Licence v3.0
city: null                # national dataset, not city-scoped - see field_mapping.city
country: GB
source_local_timezone: Europe/London

# UK dates are DD/MM/YYYY - the OPPOSITE field order from Chicago's
# MM/DD/YYYY. Must be parsed with an explicit UK format, never a US-style
# guess, or ambiguous dates (e.g. 03/04/2025) will silently swap day and
# month. date + time are combined by derivations.uk_crash_timestamp, then
# parsed in src/transform/curated.py with the explicit "%d/%m/%Y %H:%M"
# format and converted local -> UTC.
date_format: "%d/%m/%Y"
time_field: time          # separate "HH:MM" column, 24-hour, zero-padded

# Confirmed across the full 5-year file (2021-2025), not just one year.
bounding_box:
  latitude: [49.85, 60.55]
  longitude: [-7.60, 1.80]

# STATS19's missing-data convention: -1 means "not recorded / unknown"
# and is a real, common value across MANY coded fields - it is NOT the
# same as a blank/NaN cell, and must be translated to null before any
# downstream use. Confirmed at full 5-year scale that -1 appears even in
# speed_limit (a field the single-year sample suggested was always a
# clean {20,30,40,50,60,70} set - it is not, at full scale).
# Fields marked `apply_null_sentinel: true` below have -1 replaced with
# null by staging.py.
null_sentinel_value: -1
columns_using_null_sentinel:
  - speed_limit
  - junction_detail
  - junction_detail_historic
  - junction_control
  - pedestrian_crossing_human_control_historic
  - pedestrian_crossing_physical_facilities_historic
  - carriageway_hazards_historic
  - light_conditions
  - weather_conditions
  - road_surface_conditions
  - special_conditions_at_site
  - urban_or_rural_area
  - first_road_number
  - second_road_number
  - local_authority_district

field_mapping:
  # Required canonical fields, emitted as literals (see chicago.yaml).
  source_id:
    literal: uk_stats19
  source_local_timezone:
    literal: Europe/London
  crash_id:
    derive_fn: uk_crash_id               # "uk_stats19:" + collision_index
  source_record_id:
    from: collision_index
  crash_timestamp_utc:
    derive_fn: uk_crash_timestamp        # date + time; UTC conversion in curated.py
  police_notified_timestamp_utc:
    # No equivalent field in STATS19 (crashes are police-reported records
    # by construction, not civilian reports later confirmed by police).
    # Left null; the date_logic validation rule is skipped for this
    # source, same treatment as NYC's missing equivalent.
    literal: null
  city:
    # This is a national dataset covering England, Scotland, and Wales,
    # not one city. `city` is left null rather than forced into a
    # single-city model; local_authority_district (kept in staging) is
    # the closest available granularity if district-level analysis is
    # wanted later, but it is NOT promoted to canonical `city` since it
    # is a different semantic level than "Chicago" or "New York City".
    literal: null
  country:
    literal: GB
  latitude:
    from: latitude
    apply_null_sentinel: true
  longitude:
    from: longitude
    apply_null_sentinel: true
  has_valid_coordinates:
    # uk_has_valid_coordinates: both present, not the (0,0) sentinel,
    # and inside bounding_box above. Unlike Chicago and NYC, sentinel
    # (0,0) rows were not observed at all in this source (0 of 513,748
    # coordinate-bearing rows across 5 full years). The check is kept for
    # defensive consistency across sources, not because UK data has
    # shown a need for it.
    derive_fn: uk_has_valid_coordinates
  severity:
    # Standard STATS19 coding. Confirmed at full scale: 7,553 fatal /
    # 116,813 serious / 389,435 slight across 513,801 rows, no other
    # values present.
    from: collision_severity
    apply_null_sentinel: true
    map:
      1: fatal
      2: serious
      3: minor
      null: unknown
    default: unknown
  source_severity_raw:
    from: collision_severity
  num_injured_total:
    from: number_of_casualties
  num_killed:
    # Not directly stored per-collision; STATS19 records casualty-level
    # severity in a separate Casualties table (not part of this Collision
    # file). Left null here rather than inferring from collision_severity
    # == 1, since one fatal collision can have one or multiple fatalities
    # among its casualties. If casualty-level detail becomes available as
    # a joined source later, replace this with a real count; for now this
    # is a documented gap, not a silent approximation.
    literal: null
  num_vehicles_involved:
    from: number_of_vehicles
  crash_type:
    # STATS19 does not classify collisions by physical type (rear-end,
    # angle, sideswipe) the way Chicago's FIRST_CRASH_TYPE does. Closest
    # available proxy is junction_detail / road_type, kept in staging but
    # not promoted, since it describes the location's geometry rather
    # than how the vehicles collided - not a like-for-like substitute.
    literal: null
  primary_cause:
    # STATS19's causation data (contributory factors) lives in a separate
    # linked table, not in this Collision file. Left null; a real gap
    # versus Chicago (PRIM_CONTRIBUTORY_CAUSE) and NYC
    # (contributing_factor_vehicle_1), not an oversight.
    literal: null
  weather_condition:
    from: weather_conditions
    apply_null_sentinel: true
  lighting_condition:
    from: light_conditions
    apply_null_sentinel: true
  posted_speed_limit_mph:
    # Already in mph, consistent with the canonical field's unit and with
    # both other sources - no conversion needed.
    from: speed_limit
    apply_null_sentinel: true
  hit_and_run:
    # No equivalent field or proxy in STATS19. Defaults to false for
    # every UK row, same documented-gap treatment as NYC's hit_and_run.
    literal: false

unmapped_columns_kept_in_staging:
  - collision_ref_no
  - location_easting_osgr
  - location_northing_osgr
  - police_force
  - day_of_week
  - local_authority_district
  - local_authority_ons_district
  - local_authority_highway
  - local_authority_highway_current
  - first_road_class
  - first_road_number
  - road_type
  - junction_detail_historic
  - junction_detail
  - junction_control
  - second_road_class
  - second_road_number
  - pedestrian_crossing_human_control_historic
  - pedestrian_crossing_physical_facilities_historic
  - pedestrian_crossing
  - road_surface_conditions
  - special_conditions_at_site
  - carriageway_hazards_historic
  - carriageway_hazards
  - urban_or_rural_area
  - did_police_officer_attend_scene_of_accident
  - trunk_road_flag
  - lsoa_of_accident_location
  - enhanced_severity_collision
  - collision_injury_based
  - collision_adjusted_severity_serious
  - collision_adjusted_severity_slight
  - collision_ref_no

known_issues:
  - "-1 is a real sentinel value meaning 'not recorded', used across many
     coded fields including speed_limit itself. This is a DIFFERENT
     missing-data convention than Chicago (blank) or NYC (field omitted
     from JSON). Every mapped field that can carry -1 must translate it
     to null before validation, or -1 will be silently treated as a
     literal speed limit / category code."
  - "date field is DD/MM/YYYY, the opposite order from Chicago's
     MM/DD/YYYY. Any step that falls back to locale-guessing or a
     'mixed' parser risks silently swapping day and month for ambiguous
     dates (e.g. 03/04/2025). This source's date format must always be
     set explicitly."
  - "This is a national (GB-wide) dataset, not a single-city dataset like
     Chicago and NYC. `city` is left null in the canonical schema; any
     analysis that groups by 'city' will need to either exclude this
     source or use local_authority_district (kept in staging) at a
     different granularity than the other two sources provide."
  - "num_killed, primary_cause, and crash_type are structurally
     unavailable in this file (they live in separate, unjoined STATS19
     tables - Casualties and a contributory-factors table). Left null
     rather than approximated. If those companion files are added as
     future sources, this adapter should be revisited."
  - "Confirmed at full 5-year scale (513,801 rows): 0 sentinel (0,0)
     coordinate rows, coordinates ~99.99% complete, severity strictly
     confined to the documented {1,2,3} STATS19 codes. This is
     meaningfully cleaner than either Chicago or NYC on location and
     severity completeness specifically."
