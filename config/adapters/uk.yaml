# adapters/uk.yaml
#
# Source adapter for the UK Department for Transport STATS19 road safety
# collision data, scoped to 2021-2025.

source_id: uk_stats19
provider: UK Department for Transport (data.gov.uk)
dataset_url: https://www.data.gov.uk/dataset/road-accidents-safety-data
format: csv
license: Open Government Licence v3.0
city: null
country: GB
source_local_timezone: Europe/London

date_format: "%d/%m/%Y"
time_field: time

bounding_box:
  latitude: [49.85, 60.55]
  longitude: [-7.60, 1.80]

null_sentinel_value: -1
columns_using_null_sentinel:
  - speed_limit
  - junction_detail
  - junction_detail_historic
  - junction_control
  - pedestrian_crossing_human_control_historic
  - pedestrian_crossing_physical_facilities_historic
  - carriageway_hazards_historic
  - light_conditions
  - weather_conditions
  - road_surface_conditions
  - special_conditions_at_site
  - urban_or_rural_area
  - first_road_number
  - second_road_number
  - local_authority_district

field_mapping:
  crash_id:
    derive_fn: uk_crash_id
  source_record_id:
    from: collision_index
  crash_timestamp_utc:
    derive_fn: uk_crash_timestamp
  police_notified_timestamp_utc:
    literal: null
  city:
    literal: null
  country:
    literal: GB
  latitude:
    from: latitude
    apply_null_sentinel: true
  longitude:
    from: longitude
    apply_null_sentinel: true
  has_valid_coordinates:
    derive_fn: uk_has_valid_coordinates
  severity:
    from: collision_severity
    apply_null_sentinel: true
    map:
      1: fatal
      2: serious
      3: minor
      null: unknown
    default: unknown
  source_severity_raw:
    from: collision_severity
  num_injured_total:
    from: number_of_casualties
  num_killed:
    literal: null
  num_vehicles_involved:
    from: number_of_vehicles
  crash_type:
    literal: null
  primary_cause:
    literal: null
  weather_condition:
    from: weather_conditions
    apply_null_sentinel: true
  lighting_condition:
    from: light_conditions
    apply_null_sentinel: true
  posted_speed_limit_mph:
    from: speed_limit
    apply_null_sentinel: true
  hit_and_run:
    literal: false

unmapped_columns_kept_in_staging:
  - collision_ref_no
  - location_easting_osgr
  - location_northing_osgr
  - police_force
  - day_of_week
  - local_authority_district
  - local_authority_ons_district
  - local_authority_highway
  - local_authority_highway_current
  - first_road_class
  - first_road_number
  - road_type
  - junction_detail_historic
  - junction_detail
  - junction_control
  - second_road_class
  - second_road_number
  - pedestrian_crossing_human_control_historic
  - pedestrian_crossing_physical_facilities_historic
  - pedestrian_crossing
  - road_surface_conditions
  - special_conditions_at_site
  - carriageway_hazards_historic
  - carriageway_hazards
  - urban_or_rural_area
  - did_police_officer_attend_scene_of_accident
  - trunk_road_flag
  - lsoa_of_accident_location
  - enhanced_severity_collision
  - collision_injury_based
  - collision_adjusted_severity_serious
  - collision_adjusted_severity_slight
  - collision_ref_no

known_issues:
  - "-1 is a real sentinel value meaning 'not recorded'."
  - "date field is DD/MM/YYYY."
  - "This is a national (GB-wide) dataset, not a single-city dataset."
  - "num_killed, primary_cause, and crash_type are structurally unavailable."
  - "0 sentinel (0,0) coordinate rows, coordinates ~99.99% complete."