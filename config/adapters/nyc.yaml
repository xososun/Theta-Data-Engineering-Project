# adapters/nyc.yaml
#
# Source adapter for the NYC Motor Vehicle Collisions - Crashes dataset.

source_id: nyc_us
provider: NYC OpenData (Socrata)
dataset_url: https://data.cityofnewyork.us/Public-Safety/Motor-Vehicle-Collisions-Crashes/h9gi-nx95
api_endpoint: https://data.cityofnewyork.us/resource/h9gi-nx95.json
format: json
license: Public domain / open data (NYC Open Data terms)
city: New York City
country: US
source_local_timezone: America/New_York

date_format: "iso8601_date_plus_separate_time_field"
time_field: crash_time

bounding_box:
  latitude: [40.49, 40.92]
  longitude: [-74.26, -73.68]

pagination:
  page_size: 1000
  order_by: "crash_date DESC, collision_id DESC"

field_mapping:
  source_id:
    literal: nyc_us
  source_local_timezone:
    literal: America/New_York
  crash_id:
    derive_fn: nyc_crash_id
  source_record_id:
    from: collision_id
  crash_timestamp_utc:
    derive_fn: nyc_crash_timestamp
  police_notified_timestamp_utc:
    literal: null
  city:
    literal: New York City
  country:
    literal: US
  latitude:
    from: latitude
  longitude:
    from: longitude
  has_valid_coordinates:
    derive_fn: nyc_has_valid_coordinates
  num_injured_total:
    from: number_of_persons_injured
  num_killed:
    derive_fn: nyc_num_killed
  num_vehicles_involved:
    derive_fn: nyc_num_vehicles
  severity:
    derive_fn: nyc_severity
  source_severity_raw:
    derive_fn: nyc_source_severity_raw
  crash_type:
    literal: null
  primary_cause:
    from: contributing_factor_vehicle_1
  weather_condition:
    literal: null
  lighting_condition:
    literal: null
  posted_speed_limit_mph:
    literal: null
  hit_and_run:
    literal: false

unmapped_columns_kept_in_staging:
  - zip_code
  - cross_street_name
  - on_street_name
  - off_street_name
  - contributing_factor_vehicle_2
  - contributing_factor_vehicle_3
  - contributing_factor_vehicle_4
  - contributing_factor_vehicle_5
  - vehicle_type_code1
  - vehicle_type_code2
  - vehicle_type_code_3
  - vehicle_type_code_4
  - vehicle_type_code_5
  - number_of_pedestrians_injured
  - number_of_cyclist_injured
  - number_of_motorist_injured
  - borough
  - location

known_issues:
  - "Bulk ingestion MUST use a compound sort key for pagination."
  - "226 of 9,932 coordinate-bearing rows in the sample are (0,0) sentinel."
  - "borough is null in 24.3% of rows."
  - "number_of_persons_killed aggregate is ~88% null; num_killed uses components."
  - "No categorical severity, crash-type, weather, lighting, or speed limit fields."
  - "hit_and_run has no reliable source signal; defaults to false."