# adapters/nyc.yaml
#
# Source adapter for the NYC Motor Vehicle Collisions - Crashes dataset
# (Socrata dataset h9gi-nx95). Second implementation of the config-per-city
# pattern established by chicago.yaml.
#
# Values below were set from profiling a 10,000-row API sample (window:
# 2026-04-29 to 2026-06-11, because the API returns most-recent-first on a
# high-volume source; not representative of the full date spread a
# production ingestion run would cover).

source_id: nyc_us
provider: NYC OpenData (Socrata)
dataset_url: https://data.cityofnewyork.us/Public-Safety/Motor-Vehicle-Collisions-Crashes/h9gi-nx95
api_endpoint: https://data.cityofnewyork.us/resource/h9gi-nx95.json
format: json                # retrieved programmatically via REST API
license: Public domain / open data (NYC Open Data terms)
city: New York City
country: US
source_local_timezone: America/New_York

# crash_date is ISO 8601 ("YYYY-MM-DDT00:00:00.000", always midnight -
# the actual time of day lives in the separate crash_time field, which is
# a non-zero-padded "H:MM" or "HH:MM" string, e.g. "6:00", "14:50"). The
# two are combined by derivations.nyc_crash_timestamp, then parsed and
# converted local -> UTC in src/transform/curated.py (_parse_timestamps).
date_format: "iso8601_date_plus_separate_time_field"
time_field: crash_time

bounding_box:
  # NYC's five boroughs. Confirmed against the 10,000-row sample
  # (observed valid range: lat 40.51-40.91, lon -74.25 to -73.70).
  latitude: [40.49, 40.92]
  longitude: [-74.26, -73.68]

# Pagination for bulk pull: Socrata caps each request at ~1,000 rows.
# MUST sort by a compound key (date + a unique tiebreaker), not by date
# alone, or overlapping/duplicate rows are returned across page
# boundaries when many rows share the same crash_date. Confirmed via a
# real 10,000-row pull: date-only ordering produced 4 duplicate
# collision_id rows, all exactly at page boundaries.
pagination:
  page_size: 1000
  order_by: "crash_date DESC, collision_id DESC"

field_mapping:
  # Required canonical fields, emitted as literals (see chicago.yaml).
  source_id:
    literal: nyc_us
  source_local_timezone:
    literal: America/New_York
  crash_id:
    derive_fn: nyc_crash_id              # "nyc_us:" + collision_id
  source_record_id:
    from: collision_id
  crash_timestamp_utc:
    derive_fn: nyc_crash_timestamp       # crash_date + crash_time; UTC conversion in curated.py
  police_notified_timestamp_utc:
    # Not available in this source. NYC's schema has no equivalent field;
    # left null rather than defaulting to crash_timestamp_utc, so the
    # date_logic validation rule (police_notified >= crash_timestamp)
    # is skipped for this source rather than trivially always passing.
    literal: null
  city:
    literal: New York City
  country:
    literal: US
  latitude:
    from: latitude
    # Sentinel (0,0) rate is proportionally much higher here than Chicago:
    # 226 of 9,932 coordinate-bearing rows (2.3%) in the profiled sample,
    # vs. Chicago's 74 of ~1.09M (0.007%). Same rule (nulled after mapping
    # by staging._null_sentinel_coordinates), bigger practical impact.
  longitude:
    from: longitude
  has_valid_coordinates:
    # nyc_has_valid_coordinates: both present, not the (0,0) sentinel,
    # and inside bounding_box above.
    derive_fn: nyc_has_valid_coordinates
  num_injured_total:
    # number_of_persons_injured is complete (0% null in the profiled
    # sample) and reliable; used directly, unlike num_killed below.
    from: number_of_persons_injured
  num_killed:
    # number_of_persons_killed is 88.4% null in the profiled sample, but
    # the pedestrian/cyclist/motorist killed component fields are 0%
    # null. nyc_num_killed sums the components instead of trusting the
    # aggregate field; more complete and (on rows where both exist)
    # should agree with the aggregate.
    derive_fn: nyc_num_killed
  num_vehicles_involved:
    # No direct count field. nyc_num_vehicles counts the non-null
    # vehicle_type_code slots (1 through 5). Approximate: a crash can
    # involve a vehicle with no type recorded, in which case this
    # undercounts.
    derive_fn: nyc_num_vehicles
  severity:
    # NYC has no categorical severity field (unlike Chicago's
    # MOST_SEVERE_INJURY or UK's collision_severity). Only injury/fatality
    # COUNTS are available, with no serious-vs-minor distinction. This is
    # a genuine source limitation, not an adapter gap: nyc_severity can
    # produce `fatal`, a collapsed `minor` bucket, `none` or `unknown`,
    # but can never produce `serious`. Documented in the data dictionary
    # so it doesn't look like inconsistent mapping.
    derive_fn: nyc_severity
  source_severity_raw:
    derive_fn: nyc_source_severity_raw   # "killed=<n>,injured=<n>"
  crash_type:
    # No equivalent field. NYC does not classify crashes by physical type
    # (rear-end, angle, sideswipe, etc.) the way Chicago and the UK do.
    # Left null; a documented cross-source gap, not an adapter omission.
    literal: null
  primary_cause:
    from: contributing_factor_vehicle_1
  weather_condition:
    # Not collected by this source. Left null.
    literal: null
  lighting_condition:
    # Not collected by this source. Left null.
    literal: null
  posted_speed_limit_mph:
    # Not collected by this source. Left null.
    literal: null
  hit_and_run:
    # No direct flag. NYC sometimes records "Unspecified" as a
    # contributing factor when a driver fled the scene, but this is not a
    # reliable proxy (also used for ordinary unknown causes) and is NOT
    # mapped here. Default false with a documented caveat, rather than
    # guessing from free text.
    literal: false

unmapped_columns_kept_in_staging:
  - zip_code
  - cross_street_name
  - on_street_name
  - off_street_name
  - contributing_factor_vehicle_2
  - contributing_factor_vehicle_3
  - contributing_factor_vehicle_4
  - contributing_factor_vehicle_5
  - vehicle_type_code1
  - vehicle_type_code2
  - vehicle_type_code_3
  - vehicle_type_code_4
  - vehicle_type_code_5
  - number_of_pedestrians_injured
  - number_of_cyclist_injured
  - number_of_motorist_injured
  - borough        # 24.3% null in sample; coordinates are more complete
                   # and are used for location instead
  - location       # redundant nested lat/lon; latitude/longitude used instead

known_issues:
  - "Bulk ingestion MUST use a compound sort key for pagination
     (crash_date DESC, collision_id DESC), not crash_date alone, or
     duplicate rows are returned at page boundaries. Confirmed with a
     real 10,000-row pull before this fix."
  - "226 of 9,932 coordinate-bearing rows in the profiled sample (2.3%)
     are the (0,0) sentinel value - proportionally ~300x more common
     than in Chicago's full-scale data. Same rule applies, but expect a
     materially higher nulled-coordinate rate for this source."
  - "borough is null in 24.3% of rows even when latitude/longitude are
     present. Do not rely on borough for location; use coordinates."
  - "number_of_persons_killed (aggregate) is null in ~88% of sampled
     rows while the pedestrian/cyclist/motorist killed components are
     complete. num_killed is derived from the components, not the
     aggregate field, for this reason."
  - "No categorical severity, crash-type, weather, lighting, or posted
     speed limit fields exist in this source. These are structural gaps
     versus Chicago/UK, not something the adapter can recover - flagged
     in the data dictionary so cross-source comparisons don't silently
     assume equivalent granularity."
  - "hit_and_run has no reliable source signal and defaults to false for
     every NYC row. This likely undercounts hit-and-runs for this source
     specifically; do not use hit_and_run counts to compare NYC against
     Chicago (which has an explicit HIT_AND_RUN_I flag)."
