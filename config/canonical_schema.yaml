# canonical_schema.yaml
#
# This is the single schema every source adapter maps into. Staging and
# curated logic (validation, joins, clustering, EDA) only ever reads this
# schema — it never sees a source's original column names or value codes.
#
# Design notes:
# - Fields are grouped by concern (identity, time, location, severity,
#   circumstances, integration/metadata) to keep the mapping readable.
# - "source_values" under a field is the union of raw values seen across
#   configured sources so far. It's documentation, not enforced code.
# - allowed_values on an enum field IS enforced by the validation layer.
# - Thresholds below (bounding boxes, plausible ranges) come from profiling
#   the full Chicago dataset (1,096,581 rows, profiled 2026-09-23).

schema_version: "1.0"
entity: fact_crash

fields:

  # ---- Identity ----
  - name: crash_id
    type: string
    nullable: false
    unique: true
    description: >
      Globally unique ID for this crash within the canonical dataset.
      Built as "{source_id}:{source_record_id}", not reused from any
      one source's own ID scheme, because ID formats differ per city
      and must not collide across sources.

  - name: source_id
    type: string
    nullable: false
    allowed_values: [chicago_us, nyc_us, uk_stats19]  # extend per added source
    description: Which configured source adapter produced this record.

  - name: source_record_id
    type: string
    nullable: false
    description: >
      The source's own natural key, kept verbatim for traceability and
      for UPSERT idempotency (source_id + source_record_id is the
      dedup key at load time).

  # ---- Time ----
  - name: crash_timestamp_utc
    type: timestamp
    nullable: false
    description: >
      Crash date/time normalized to UTC. Source timestamps are assumed
      local to the source's city/timezone unless the source explicitly
      provides UTC or an offset.
    validation:
      not_future: true
      min_plausible: "2000-01-01"  # generous; true floor is source-specific

  - name: police_notified_timestamp_utc
    type: timestamp
    nullable: true
    validation:
      must_be_gte: crash_timestamp_utc
      # Chicago full-scale profiling found exactly 1 row (of 1,096,581)
      # violating this — real source data error, not a parsing artifact.
      # Rule: flag and quarantine, do not silently drop or "fix" the value.

  - name: source_local_timezone
    type: string
    nullable: false
    description: IANA timezone name used to convert this source's local times to UTC (e.g. "America/Chicago").

  # ---- Location ----
  - name: city
    type: string
    nullable: false

  - name: country
    type: string
    nullable: false
    description: ISO 3166-1 alpha-2 code (e.g. "US", "GB").

  - name: latitude
    type: float
    nullable: true
    description: >
      Null when the source has no geocode. On full-scale Chicago data
      this is 0.78% of rows — small enough that clustering/EDA can run
      on the non-null subset without material bias, unlike early small
      samples which overstated this to 41-87%.
    validation:
      reject_if: "value == 0 and longitude == 0"  # sentinel (0,0), not a real point
      bounding_box: source_specific  # see each adapter's config

  - name: longitude
    type: float
    nullable: true
    validation:
      reject_if: "value == 0 and latitude == 0"
      bounding_box: source_specific

  - name: has_valid_coordinates
    type: boolean
    nullable: false
    description: >
      Derived flag: true only if latitude/longitude are both non-null,
      non-(0,0), and inside the source's bounding box. Lets downstream
      spatial analysis filter cleanly without re-deriving the logic.

  # ---- Severity (canonical scale, mapped from each source's own scale) ----
  - name: severity
    type: enum
    nullable: false
    allowed_values: [fatal, serious, minor, none, unknown]
    description: >
      Canonical severity, mapped per-source. Chicago's MOST_SEVERE_INJURY
      maps as:
        FATAL                    -> fatal
        INCAPACITATING INJURY    -> serious
        NONINCAPACITATING INJURY -> minor
        REPORTED, NOT EVIDENT    -> minor
        NO INDICATION OF INJURY  -> none
        null / NaN               -> unknown  (2,370 rows at full scale)

  - name: source_severity_raw
    type: string
    nullable: true
    description: Original source value, kept for audit and re-mapping if the canonical scale changes.

  - name: num_injured_total
    type: integer
    nullable: true
    validation: { min: 0 }

  - name: num_killed
    type: integer
    nullable: true
    validation: { min: 0 }

  - name: num_vehicles_involved
    type: integer
    nullable: true
    validation: { min: 1, max: 20 }  # Chicago NUM_UNITS observed range: 1-6; wide margin for other sources

  # ---- Circumstances ----
  - name: crash_type
    type: string
    nullable: true
    description: Free text/category from source (e.g. sideswipe, rear end, angle). Not standardized across sources yet — v1 keeps source vocabulary, v2 may build a shared taxonomy.

  - name: primary_cause
    type: string
    nullable: true

  - name: weather_condition
    type: string
    nullable: true

  - name: lighting_condition
    type: string
    nullable: true

  - name: posted_speed_limit_mph
    type: integer
    nullable: true
    validation:
      flag_if_outside: [5, 70]
      # Chicago full-scale data has values as low as 0 and as high as 60;
      # flag (don't reject) anything outside [5,70] as a business-rule
      # warning, since some may be legitimate signage (e.g. school zones).

  - name: hit_and_run
    type: boolean
    nullable: false
    description: >
      Canonical boolean. Chicago's HIT_AND_RUN_I is "Y-or-blank"; blank
      maps to false, not null, since the source only ever records the
      positive case.

  # ---- Ingestion metadata (not part of any source's original schema) ----
  - name: ingested_at_utc
    type: timestamp
    nullable: false

  - name: batch_id
    type: string
    nullable: false
    description: Identifies the pipeline run that produced this row. Used for rerun-safety (replace-partition) and dq_run_log joins.

  - name: source_row_raw_ref
    type: string
    nullable: true
    description: Pointer back to the raw-layer file/row this record came from, for lineage.

# Fields intentionally NOT promoted to canonical (v1):
#   - Chicago's ROAD_DEFECT, ALIGNMENT, TRAFFICWAY_TYPE, DEVICE_CONDITION,
#     TRAFFIC_CONTROL_DEVICE, STREET_* address parts, IDOT_CONTROL_NO,
#     REPORT_TYPE, DOORING_I, WORK_ZONE_*, PHOTOS_TAKEN_I, STATEMENTS_TAKEN_I,
#     WORKERS_PRESENT_I. These are >=95% null at full scale (the flag
#     columns) or too source-specific to generalize cheaply. They are
#     preserved in the staging layer per-source and can be promoted later
#     if a specific analysis needs them.
