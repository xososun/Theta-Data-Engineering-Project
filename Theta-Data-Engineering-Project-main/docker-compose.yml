# docker-compose.yml
#
# Services:
#   postgres           - single PostgreSQL instance, hosting TWO databases:
#                         one for the curated crash data (fact_crash, etc.,
#                         from sql/schema.sql), one for Airflow's own
#                         metadata. Kept as one container to minimize
#                         resource use for a course project; separated by
#                         database name, not by container, which is a
#                         reasonable simplification to call out and defend
#                         in the presentation if asked.
#   airflow-init        - one-shot: initializes the Airflow metadata DB and
#                         creates the admin user, then exits.
#   airflow-webserver    - Airflow UI.
#   airflow-scheduler    - Airflow scheduler (LocalExecutor - no separate
#                         worker/broker needed at this project's scale).
#   pipeline             - the SAME image as Airflow, but with no long-running
#                         command, for manual extractor runs:
#                           docker compose run --rm pipeline \
#                               python src/extract/chicago_extractor.py \
#                               --input /opt/airflow/data/incoming/chicago.csv
#
# Run `docker compose up -d` to start everything, or
# `docker compose run --rm pipeline <command>` for one-off tasks.
# See README.md for the full startup sequence.

services:

  postgres:
    image: postgres:16
    container_name: crash_pipeline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}           # curated crash-data database
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00_airflow_metadata.sql:/docker-entrypoint-initdb.d/00_airflow_metadata.sql:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # ^ Postgres runs every script in /docker-entrypoint-initdb.d/ in
      #   alphabetical order, ONLY on first container startup (empty data
      #   volume) - hence the 00_/01_ prefixes: the Airflow metadata
      #   database must exist before anything else runs, and schema.sql
      #   itself only touches the POSTGRES_DB database (crash_pipeline),
      #   never airflow_metadata, so order between the two doesn't matter
      #   for schema.sql's own content - the prefix is about readability
      #   and guarding against a future init script that DOES depend on
      #   ordering. Re-running `docker compose up` against an existing
      #   volume will NOT re-apply either script - that's a postgres image
      #   behavior, not a bug here. Drop the volume
      #   (`docker compose down -v`) to force a clean re-init if needed.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build: .
    container_name: crash_pipeline_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow_common_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Our pipeline's own config, separate from Airflow's internal env vars.
      PIPELINE_POSTGRES_HOST: postgres
      PIPELINE_POSTGRES_PORT: "5432"
      PIPELINE_POSTGRES_DB: ${POSTGRES_DB}
      PIPELINE_POSTGRES_USER: ${POSTGRES_USER}
      PIPELINE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PIPELINE_RAW_DATA_ROOT: /opt/airflow/data/raw
      PIPELINE_STAGING_DATA_ROOT: /opt/airflow/data/staging
      PIPELINE_CURATED_DATA_ROOT: /opt/airflow/data/curated
    volumes:
      - ./data:/opt/airflow/data
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true

  airflow-webserver:
    build: .
    container_name: crash_pipeline_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_common_env
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build: .
    container_name: crash_pipeline_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_common_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    command: scheduler

  # One-off runner for manual/ad-hoc pipeline commands, outside of Airflow.
  # Not started by `docker compose up` by default (no restart policy, no
  # long-running command) - invoke explicitly:
  #   docker compose run --rm pipeline python src/extract/chicago_extractor.py --input ...
  pipeline:
    build: .
    container_name: crash_pipeline_runner
    environment: *airflow_common_env
    volumes:
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./sql:/opt/airflow/sql
    entrypoint: []
    # ^ Deliberately empty, NOT "/bin/bash". With entrypoint set to a bare
    #   /bin/bash and no "-c", the command you pass to `docker compose run`
    #   is NOT executed as a command - bash treats its first argument as a
    #   SHELL SCRIPT FILE to read and interpret. Running
    #   `docker compose run --rm pipeline python script.py` would resolve
    #   to `/bin/bash python script.py`, and bash tries to open the
    #   `python` binary (found via PATH) as a text script, failing with
    #   "cannot execute binary file" - a real bug found during testing,
    #   not an architecture or Windows/WSL2 issue (confirmed by checking
    #   that the IDENTICAL failure happens with plain `uname -m` too, and
    #   that `airflow-init` below works because its command is correctly
    #   ["-c", "<script>"], which bash -c actually runs as commands).
    #   An empty entrypoint lets `docker compose run`'s command execute
    #   directly (exec'd as a real process via PATH lookup), e.g.:
    #     docker compose run --rm pipeline python src/extract/chicago_extractor.py --input ...
    #     docker compose run --rm pipeline bash          # for an interactive shell instead
    profiles: ["tools"]   # excluded from default `docker compose up`

volumes:
  pgdata:
  airflow_logs:
